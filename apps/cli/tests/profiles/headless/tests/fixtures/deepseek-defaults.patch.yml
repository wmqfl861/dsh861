# Local endpoint and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  config:
    baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
    thinking: enabled
    reasoningEffort: low
    # Keep-alives arrive every KEEP_ALIVE_INTERVAL_MS; the idle budget must stay
    # a clear multiple of that cadence or scheduler jitter retries the main
    # request and breaks the two-request contract.
    streamIdleTimeoutMs: 1000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
